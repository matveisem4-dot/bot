name: ONYX_RUN
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Start
        run: |
          pip install aiogram
          python main.py
